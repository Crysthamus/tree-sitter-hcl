name: Auto-Sync and Whitelist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          # This exact email maps the commit to the system bot, keeping your contribution graph clean.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/tree-sitter-grammars/tree-sitter-hcl.git
          git fetch upstream main

      - name: Sync pure mirror
        run: |
          git checkout -B main upstream/main
          git push origin main --force

      - name: Patch and deploy
        run: |
          # Creates the patched branch based on the freshly synced main
          git checkout -B release-whitelisted upstream/main
          
          jq '.files = (.files // []) + ["dialects"] | .files |= unique' package.json > tmp.json && mv tmp.json package.json
          
          git add package.json
          git commit -m "chore: auto-whitelist dialects directory for ci builds."
          
          # Push the patched branch
          git push origin release-whitelisted --force
